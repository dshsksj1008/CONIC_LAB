-bottom .panel-title h3{font-size:16px;margin-bottom:8px}.ar-bottom .formula{font-size:13px}.ar-bottom .math-details{font-size:11px}.ar-bottom .toggles{margin:9px 0}.ar-banner{position:fixed;z-index:500;top:28%;left:8%;right:8%;max-width:500px;margin:auto;background:#0b2539eb;border:1px solid #4b7788;border-radius:16px;text-align:center;padding:19px;color:white;line-height:1.75;font-size:14px;pointer-events:none}.ar-banner.hidden{display:none}.graph-note{color:#a1bed2;font-size:12px;margin-top:10px;line-height:1.7}@media(max-width:940px){.hero{grid-template-columns:1fr}.hero-visual{min-height:310px}.explore-grid{grid-template-columns:1fr}.card-grid{grid-template-columns:repeat(2,1fr)}.hero{padding-top:35px}.steps{grid-template-columns:1fr}.ar-bottom{width:min(440px,100%)}}@media(max-width:600px){.container{padding:0 16px}.header{height:auto;min-height:70px;align-items:flex-start;padding:15px 0;flex-direction:column}.header nav{gap:3px}.header nav a{font-size:11px;padding:7px}.hero h1{font-size:43px}.hero-visual{min-height:260px}.hero-visual img{max-width:310px}.card-grid{gap:9px}.card{padding:14px}.card strong{font-size:17px}.card p{font-size:12px}.viewer-shell{min-height:270px;height:40vh}.panel{padding:17px}.print-sheet{width:100%;min-height:auto;grid-template-columns:1fr;grid-template-rows:none;gap:6mm;padding:9mm}.print-marker img{width:75mm;height:75mm}.ar-top b{font-size:14px}}@page{size:A4;margin:0}@media print{.no-print,.header,.footer,.print-hud{display:none!important}html,body{background:white!important;margin:0!important}.print-sheet{width:210mm;height:297mm;min-height:297mm;max-height:297mm;margin:0;box-shadow:none;padding:12mm 14mm;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr auto;gap:8mm;break-after:page}.print-marker{border:1px solid #dbe4e8}.print-marker img{width:74mm;height:74mm}.print-sheet:last-of-type{break-after:auto}}

</style><style>.testline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #28465c}.testline small{color:#a8c1d2}.pass{color:#57e6cf}.warn{color:#ffcf82}.fail{color:#ff8096}.help{font-size:13px;color:#bad5e4;line-height:1.75}.standalonecanvas{display:block;width:100%;max-height:560px;background:#071b30;border:1px solid #34546a;border-radius:16px}.testbtn{margin:7px 7px 7px 0}</style></head><body><header class="header container"><a href="index.html" class="logo">◈ CONIC <span>LAB</span> <small style="font-size:11px;color:#8baaba">V5</small></a><nav><a href="index.html">홈</a><a href="lab.html">3D 실험실</a><a href="ar.html">마커 AR</a><a href="markers.html">마커 인쇄</a><a href="diagnostics.html">환경 점검</a></nav></header><main class="container"><section class="explore-header"><span class="tag">OFFLINE BACKUP · NO CAMERA REQUIRED</span><h1>오프라인 수학 검증</h1></section><div class="info-row" style="grid-template-columns:minmax(0,1.2fr) minmax(270px,.8fr);margin-top:22px"><div class="panel"><h3>2D 좌표 검증 화면</h3><canvas id="cv" class="standalonecanvas" width="900" height="720"></canvas><p class="help">이 화면은 외부 라이브러리나 카메라 없이 동작합니다. 3D AR이 작동하지 않을 때 예비 시연용입니다.</p></div><div class="panel"><h3>방정식 직접 조절</h3><div class="kind-tabs" id="kinds"><button data-k="ellipse">타원</button><button data-k="parabola">포물선</button><button data-k="hyperbola">쌍곡선</button><button data-k="master">원뿔 절단</button></div><div id="inputrows"></div><div class="math-pane"><span class="tag">MATHEMATICAL MODEL</span><div class="formula" id="eq"></div><div id="details" class="math-details"></div></div><div class="actions"><a class="button" href="lab.html">3D 버전 이동</a><a class="button" href="ar.html">마커 AR 이동</a></div></div></div></main><footer class="footer"><div class="container">CONIC LAB V5 · 웹/AR 시제품 · 카메라 사용에는 HTTPS와 사용자 권한이 필요합니다.</div></footer><script>(()=>{const c=document.getElementById('cv'),ctx=c.getContext('2d');let kind='ellipse';const p={ellipse:{a:.54,b:.35,t:45},parabola:{p:.2,t:.3},hyperbola:{a:.3,b:.22,t:.7},master:{theta:28,h:.23}};const fields={ellipse:[['a','장반경 a',.28,.68,.01],['b','단반경 b',.15,.6,.01]],parabola:[['p','초점거리 p',.08,.32,.01]],hyperbola:[['a','실축 반길이 a',.17,.46,.01],['b','허축 반길이 b',.13,.4,.01]],master:[['theta','절단각 θ',0,80,.1],['h','절단위치 h',.12,.42,.01]]};const K=.65,L=1.05,gamma=Math.atan(1/K)*180/Math.PI;
function tp(th){return th===0?'원':Math.abs(th-gamma)<.0002?'포물선':th<gamma?'타원':'쌍곡선'}
function section(th,h){const m=Math.tan(th*Math.PI/180);const paths=[];for(const sgn of [-1,1]){let pts=[];function flush(){if(pts.length>1)paths.push(pts);pts=[]}for(let i=0;i<=1500;i++){const t=i*Math.PI*2/1500,den=1-sgn*m*K*Math.cos(t),y=h/den,x=K*Math.abs(y)*Math.cos(t),z=K*Math.abs(y)*Math.sin(t);if(Math.abs(y)<=L&&y*sgn>0&&Math.abs(den)>1e-8){if(pts.length){const v=pts[pts.length-1];if(Math.hypot(v[0]-x,v[1]-z)>.13)flush()}pts.push([x/Math.max(0.1,Math.cos(th*Math.PI/180)),z])}else flush()}flush()}return paths}
function draw(){const W=c.width,H=c.height;ctx.fillStyle='#071b30';ctx.fillRect(0,0,W,H);const curr=p[kind],Q=kind==='master'?section(curr.theta,curr.h):[];let B=kind==='master'?Math.max(1,...Q.flat(1).flat().map(Math.abs)):1.03;B=Math.max(B,.85);const S=Math.min(W,H)*.43/B;const map=(x,y)=>[W/2+x*S,H/2-y*S];function ln(a,b,color='#66899f',line=1){ctx.strokeStyle=color;ctx.lineWidth=line;ctx.beginPath();ctx.moveTo(...map(...a));ctx.lineTo(...map(...b));ctx.stroke()}for(let j=-Math.ceil(B/.2);j<=Math.ceil(B/.2);j++){let v=j*.2;ln([-B,v],[B,v],'#1c3a53');ln([v,-B],[v,B],'#1c3a53')}ln([-B,0],[B,0],'#a2bdcf',2);ln([0,-B],[0,B],'#a2bdcf',2);ctx.fillStyle='#b3d4e6';ctx.font='20px system-ui';ctx.fillText('x',W-28,H/2-15);ctx.fillText('y',W/2+15,22);
function plot(a,col='#59e9ce'){if(a.length<2)return;ctx.strokeStyle=col;ctx.lineWidth=5;ctx.beginPath();a.forEach((v,i)=>{if(i)ctx.lineTo(...map(...v));else ctx.moveTo(...map(...v))});ctx.stroke()}
function pt(a,n,col='#f9cb79'){const [x,y]=map(...a);ctx.beginPath();ctx.arc(x,y,7,0,2*Math.PI);ctx.fillStyle=col;ctx.fill();ctx.fillText(n,x+12,y-14)}
if(kind==='ellipse'){let r=[];for(let i=0;i<=400;i++){let t=2*Math.PI*i/400;r.push([curr.a*Math.cos(t),curr.b*Math.sin(t)])}plot(r);let d=Math.sqrt(curr.a**2-curr.b**2);pt([-d,0],'F₁');pt([d,0],'F₂');pt([curr.a,0],'V₁','#ff8194');pt([-curr.a,0],'V₂','#ff8194');document.getElementById('eq').textContent=`x²/${(curr.a**2).toFixed(3)} + y²/${(curr.b**2).toFixed(3)} = 1`;document.getElementById('details').textContent=`초점 거리 c=${d.toFixed(3)}, 장축 2a=${(2*curr.a).toFixed(2)}, 단축 2b=${(2*curr.b).toFixed(2)}`}
if(kind==='parabola'){let r=[];for(let i=0;i<=400;i++){let z=-.85+1.7*i/400,x=z*z/(4*curr.p);if(x<B)r.push([x,z])}plot(r,'#ffcd7e');pt([curr.p,0],'F');pt([0,0],'V','#ff8194');ln([-curr.p,-B],[-curr.p,B],'#ffcd7e',3);document.getElementById('eq').textContent=`y² = ${(4*curr.p).toFixed(3)}x`;document.getElementById('details').textContent=`초점 F=(${curr.p.toFixed(2)},0), 준선 x=${(-curr.p).toFixed(2)}`}
if(kind==='hyperbola'){for(let sgn of [-1,1]){let r=[];for(let i=0;i<=400;i++){let t=-1.3+2.6*i/400,x=sgn*curr.a*Math.cosh(t),y=curr.b*Math.sinh(t);if(Math.abs(x)<B&&Math.abs(y)<B)r.push([x,y])}plot(r,'#bda6ff')}let d=Math.hypot(curr.a,curr.b);pt([-d,0],'F₁');pt([d,0],'F₂');pt([curr.a,0],'V₁','#ff8194');pt([-curr.a,0],'V₂','#ff8194');ln([-B,-B*curr.b/curr.a],[B,B*curr.b/curr.a],'#8ca9bd');ln([-B,B*curr.b/curr.a],[B,-B*curr.b/curr.a],'#8ca9bd');document.getElementById('eq').textContent=`x²/${(curr.a**2).toFixed(3)} − y²/${(curr.b**2).toFixed(3)} = 1`;document.getElementById('details').textContent=`초점 거리 c=${d.toFixed(3)}, 점근선 y=±${(curr.b/curr.a).toFixed(3)}x`}
if(kind==='master'){for(let arr of Q)plot(arr);document.getElementById('eq').textContent=`θ=${curr.theta.toFixed(1)}°, ${tp(curr.theta)}`;document.getElementById('details').textContent=`x²+z²=${(K*K).toFixed(4)}y², 절단평면 y=${curr.h.toFixed(2)}+tan(${curr.theta.toFixed(1)}°)x\n포물선 경계각 γ=${gamma.toFixed(2)}°`}
}
function update(){const root=document.getElementById('inputrows');root.innerHTML='';if(kind==='master'){const row=document.createElement('div');row.className='preset-row';for(let [label,a] of [['원',0],['타원',30],['포물선',gamma],['쌍곡선',70]]){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{p.master.theta=a;update()};row.append(b)}root.append(row)}for(const [key,label,min,max,step] of fields[kind]){const row=document.createElement('div');row.className='range-row';const tit=document.createElement('div');tit.className='range-label';const t=document.createElement('span');t.textContent=label;const val=document.createElement('output');val.textContent=p[kind][key].toFixed(2);tit.append(t,val);const sl=document.createElement('input');sl.type='range';sl.min=min;sl.max=max;sl.step=step;sl.style.width='100%';sl.value=p[kind][key];sl.oninput=()=>{p[kind][key]=+sl.value;if(kind==='ellipse'){if(p.ellipse.b>=p.ellipse.a-.02){if(key==='a')p.ellipse.b=p.ellipse.a-.02;else p.ellipse.a=p.ellipse.b+.02}}val.textContent=p[kind][key].toFixed(2);draw()};row.append(tit,sl);root.append(row)}document.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('active',b.dataset.k===kind));draw()}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;update()});update()})();</script></body></html>
