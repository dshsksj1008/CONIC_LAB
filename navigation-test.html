<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONIC LAB 파일/이동 진단</title><style>body{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;background:#081726;color:#f2fbff;padding:26px;max-width:800px;margin:auto}a{color:#4fe2d0}h1{font-size:29px}.panel{border:1px solid #385870;background:#122b40;border-radius:18px;padding:20px;margin-top:18px}.status{display:flex;justify-content:space-between;border-bottom:1px solid #35556b;padding:11px 0;gap:14px}.yes{color:#6ef1b5}.no{color:#ffb08e}button{padding:10px 13px;border-radius:10px;border:1px solid #6acac4;background:#11464a;color:#fff;font-weight:700}small{color:#b9d2de;line-height:1.7}ul{line-height:1.9}</style></head><body><h1>CONIC LAB · 페이지 이동 진단</h1><p>각 링크를 누르면 다른 HTML로 이동합니다. 마커 AR은 반드시 HTTPS로 사용하세요.</p><div class="panel" id="env"></div><div class="panel"><h2>실제 파일 확인</h2><div id="results"></div></div><div class="panel"><h2>페이지 직접 이동</h2><ul><li><a href="index.html">메인</a></li><li><a href="lab.html">3D 수학 실험실</a></li><li><a href="ar.html">마커 AR</a></li><li><a href="markers.html">마커 4종 인쇄</a></li><li><a href="offline-demo.html">오프라인 수학 검증</a></li><li><a href="diagnostics.html">AR 환경 점검</a></li></ul><p><small>파일을 열 수 없다는 오류가 나면, ZIP 내부의 index.html을 직접 미리보기로 실행한 것이 아닌지 확인하고 전체 폴더를 HTTPS로 배포하세요.</small></p></div><script>let https=location.protocol==='https:';document.getElementById('env').innerHTML='<b>접속 환경</b><p>주소: '+location.href.replaceAll('<','&lt;')+'</p><p>HTTPS: '+(https?'정상':'미사용 · 카메라 AR 주의')+'</p>';const names=['index.html','lab.html','ar.html','markers.html','offline-demo.html','conic-core.js','ar-app.js','markers/ellipse.patt','markers/parabola.patt','markers/hyperbola.patt','markers/master.patt'];const out=document.getElementById('results');Promise.all(names.map(async n=>{let row=document.createElement('div');row.className='status';let b=document.createElement('b');b.textContent=n;let result=document.createElement('span');try{let r=await fetch(n,{cache:'no-store'});result.textContent=r.ok?'HTTP '+r.status+' · 정상':'HTTP '+r.status+' · 실패';result.className=r.ok?'yes':'no'}catch(e){result.textContent='접근 실패 (로컬 파일 제한 가능)';result.className='no'}row.append(b,result);out.append(row)}));</script></body></html>
